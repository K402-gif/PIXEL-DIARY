name: Publicar sitio
on:
  push: { branches: [main] }
  schedule: [{ cron: "0 */6 * * *" }]
  workflow_dispatch:
permissions: { contents: write, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  publicar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pixel-diario-auto
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/update.mjs
        env:
          STEAM_CC: es
          AFF_STEAM: ${{ secrets.AFF_STEAM }}
          AFF_EPIC: ${{ secrets.AFF_EPIC }}
      - name: Guardar datos
        run: |
          git config user.name "pixel-diario-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/data.json
          git diff --cached --quiet || (git commit -m "Actualizar datos" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: pixel-diario-auto/public }
      - id: deployment
        uses: actions/deploy-pages@v4
